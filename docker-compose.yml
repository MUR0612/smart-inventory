# Local stack. Only the gateway is published; MySQL, Redis and the two
# services stay on the internal network. For debugging, add
#   -f docker-compose.debug.yml   (binds them to 127.0.0.1 only).
#
# All credentials come from .env (create it with: python scripts/init_env.py).
# This is a local HTTP setup; public deployments use HTTPS (see k8s/README.md).
name: smart-inventory

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:?DB_NAME is not set - run scripts/init_env.py}
  DB_USER: ${DB_USER:?DB_USER is not set}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}

x-app-env: &app-env
  <<: *db-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is not set}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is not set}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off schema migration + least-privilege app account; apps wait for it.
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      <<: *db-env
      MIGRATE_DB_USER: root
      MIGRATE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_USERS: ${AUTH_USERS:?AUTH_USERS is not set}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/inventory/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      INVENTORY_BASE_URL: http://inventory-service:8001
    depends_on:
      migrate:
        condition: service_completed_successfully
      inventory-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/orders/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - inventory-service
      - order-service
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"

volumes:
  mysql-data:
