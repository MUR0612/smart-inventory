# API gateway + static frontend. Same file for Docker Compose and Kubernetes
# (both expose the services as inventory-service:8001 and order-service:8002).
# Runs unprivileged on port 8080; TLS is terminated in front of it
# (GKE load balancer) or not at all for local HTTP use.
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 64k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Trust X-Forwarded-For only from Google Cloud load balancer ranges.
  set_real_ip_from 130.211.0.0/22;
  set_real_ip_from 35.191.0.0/16;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  'rid=$request_id rt=$request_time';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Slow down password guessing on the login endpoint.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }
  # HSTS only when the original request arrived over HTTPS.
  map $forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
  }

  map $uri $docs_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'";
  }

  # No upstream keepalive: each request opens a new connection through the
  # Service, so a pod that is shutting down never receives reused connections.
  upstream inventory_upstream { server inventory-service:8001; }
  upstream order_upstream     { server order-service:8002; }

  server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $hsts always;
    # Revalidate (ETag) on every load so a redeploy never mixes old and new JS/CSS.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Gateway liveness (used by Kubernetes probes and the GKE load balancer).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://inventory_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/auth/ {
      proxy_pass http://inventory_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    # FastAPI's Swagger page needs an inline script; relax CSP only there.
    location = /api/inventory/docs {
      add_header Content-Security-Policy $docs_csp always;
      add_header X-Content-Type-Options "nosniff" always;
      proxy_pass http://inventory_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    location = /api/orders/docs {
      add_header Content-Security-Policy $docs_csp always;
      add_header X-Content-Type-Options "nosniff" always;
      proxy_pass http://order_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    # Paths are forwarded unchanged: the services serve the full /api/... path.
    location /api/inventory/ {
      proxy_pass http://inventory_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    location = /api/orders {
      proxy_pass http://order_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/orders/ {
      proxy_pass http://order_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
      default_type application/json;
      return 404 '{"detail":"Not found"}';
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
